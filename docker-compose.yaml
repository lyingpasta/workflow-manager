services:
  redis:
    image: redis
    ports:
      - 6380:6379

  postgres: 
    image: postgres:17
    environment:
      TZ: 'Japan'
      PGTZ: 'Japan'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: workflow 
    volumes:
      - .volumes/postgres:/var/lib/postgresql/data
    ports:
      - 5434:5432

